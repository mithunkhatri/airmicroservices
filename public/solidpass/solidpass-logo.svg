<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Background circle -->
  <rect width="200" height="200" rx="48" fill="#DFE7FF"/>
  
  <!-- Lock icon -->
  <g transform="translate(100, 100)">
    <!-- Lock body -->
    <rect x="-28" y="-8" width="56" height="50" rx="6" fill="#4F46E5"/>
    
    <!-- Lock shackle (top part) -->
    <path d="M -20 -8 Q -20 -40 0 -40 Q 20 -40 20 -8" fill="none" stroke="#4F46E5" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Keyhole -->
    <circle cx="0" cy="10" r="4" fill="white" opacity="0.6"/>
  </g>
</svg>
